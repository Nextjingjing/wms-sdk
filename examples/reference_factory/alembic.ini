# Migrations of the reference factory example, the way a factory project keeps them:
#
#   set WMS_DATABASE_URL=mssql+pyodbc://user:password@host,port/db?driver=ODBC+Driver+18+for+SQL+Server
#   alembic -c examples/reference_factory/alembic.ini upgrade head
#
# The database URL comes from WMS_DATABASE_URL, never from this file.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
